<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasure Hunt Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Matches the Leaderboard "Coming Soon" section: the city artwork under a 90%
   #c1330a wash, Atomic Marker headings in white, Almarai 700 body at .05em.
   The board sits on a 90% white panel. */
@font-face{font-family:'Atomic Marker';src:url('https://static1.squarespace.com/static/68f0178dd88a7e52ec46ae7e/t/6aa9db35bc4f704c9378c402/1789516598919/Set+Sail+Studios+-+Atomic+Marker+Regular.otf') format('opentype');font-display:block}
:root{
  --rust:#c1330a; --ink:#111; --forest:#1b3b15; --moss:#607667;
  --ember:#d13d0e; --alert:#c11212; --peach:#ffd9c4; --rule:rgba(27,59,21,.2);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Almarai',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  background:linear-gradient(rgba(193,51,10,.9),rgba(193,51,10,.9)),url('leaderboard-bg.jpg') center/cover;
  background-color:var(--rust);
  min-height:100vh;padding:clamp(72px,10.5vw,158px) clamp(16px,4vw,32px) clamp(44px,6vw,90px);
}
.head{text-align:center;margin:0 auto clamp(30px,4vw,44px);max-width:1000px}
.eyebrow{font-family:'Atomic Marker',cursive;font-size:clamp(24px,3.5vw,44px);color:var(--peach);margin:0 0 14px}
h1{font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(46px,9vw,130px);line-height:1.05;color:#fff;margin:0}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:clamp(26px,4vw,38px) 0 clamp(26px,4vw,40px)}
.tabs button{font-family:'Almarai',sans-serif;font-weight:700;font-size:clamp(13px,1.5vw,15px);letter-spacing:.08em;cursor:pointer;color:#fff;background:rgba(12,26,8,.35);border:2px solid #f3ead9;padding:11px clamp(14px,2.6vw,24px);transition:transform .15s ease,background .15s ease,color .15s ease}
.tabs button:hover{transform:scale(1.04)}
.tabs button[aria-selected="true"]{background:#f3ead9;color:var(--rust)}
.tabs button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel{max-width:1000px;margin:0 auto;background:rgba(255,255,255,.9);color:var(--ink);padding:clamp(22px,4vw,48px) clamp(16px,3.5vw,44px) clamp(24px,3.5vw,40px)}
.region{font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(28px,3.6vw,44px);letter-spacing:.04em;color:var(--ink);text-align:center;margin:0 0 8px}
.meta{font-size:14px;color:var(--moss);text-align:center;margin:0 0 clamp(20px,3vw,30px);min-height:1.2em}
.board{margin:0;padding:0;list-style:none}
.hrow,.row{display:grid;grid-template-columns:clamp(44px,6vw,72px) minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1fr) clamp(88px,11vw,132px);align-items:center;gap:clamp(10px,2vw,22px)}
.hrow{font-weight:700;font-size:clamp(11px,1.3vw,13px);letter-spacing:.08em;text-transform:uppercase;color:var(--moss);padding:0 clamp(6px,1.4vw,14px) 12px;border-bottom:2px solid var(--forest)}
.row{padding:clamp(12px,1.8vw,17px) clamp(6px,1.4vw,14px);border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.rank{font-family:'Atomic Marker',cursive;font-size:clamp(26px,3.6vw,40px);line-height:1;color:var(--forest);text-align:center}
.row.top3 .rank{color:var(--rust)}
.name{font-weight:800;font-size:clamp(15px,2vw,20px);line-height:1.3;overflow-wrap:anywhere}
.handle{font-size:clamp(13px,1.7vw,17px);line-height:1.3;color:var(--forest);overflow-wrap:anywhere}
.handle em{font-style:normal;font-size:clamp(11px,1.3vw,13px);font-weight:700;letter-spacing:.04em;color:var(--moss);white-space:nowrap}
.country{font-size:clamp(12px,1.5vw,16px);line-height:1.3;color:var(--forest);overflow-wrap:anywhere}
.pts{font-family:'Atomic Marker',cursive;font-size:clamp(24px,3.2vw,38px);line-height:1;color:var(--ember);text-align:right;white-space:nowrap}
.pts small{font-family:'Almarai',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--moss);margin-left:5px}
.empty{text-align:center;padding:clamp(30px,5vw,54px) 16px;color:var(--moss)}
.empty strong{display:block;font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(24px,3.4vw,38px);letter-spacing:.03em;color:var(--ink);margin:14px 0 8px}
.empty p{margin:0 auto;max-width:640px;font-weight:700;font-size:clamp(14px,1.5vw,17px);letter-spacing:.05em;line-height:1.6;color:var(--forest)}
.note{font-weight:700;font-size:clamp(13px,1.4vw,15px);letter-spacing:.05em;line-height:1.6;color:var(--peach);text-shadow:0 1px 6px rgba(0,0,0,.35);text-align:center;margin:clamp(22px,3vw,32px) auto 0;max-width:780px}

@media (max-width:620px){
  .hrow,.row{grid-template-columns:clamp(34px,10vw,48px) minmax(0,1fr) clamp(70px,20vw,96px);gap:10px;row-gap:2px;align-items:start}
  .hrow .h-handle,.hrow .h-country{display:none}
  .row .handle{grid-column:2;grid-row:2}
  .row .country{grid-column:2;grid-row:3;font-size:13px;color:var(--moss)}
  .row .rank,.row .pts{align-self:center}
  .pts small{display:none}
}
</style>
</head>
<body>
<header class="head">
  <p class="eyebrow">The Leaderboard</p>
  <h1>Top 10 Sky Pirates</h1>
</header>
<div class="tabs" id="tabs" role="tablist" aria-label="Leaderboard region"></div>
<main class="panel">
  <h2 class="region" id="region"></h2>
  <p class="meta" id="meta" aria-live="polite"></p>
  <div class="hrow" aria-hidden="true"><span>Rank</span><span>Name</span><span class="h-handle">Handle</span><span class="h-country">Country</span><span style="text-align:right">Points</span></div>
  <ol class="board" id="board"></ol>
</main>
<p class="note" id="note"></p>
<script>
(function () {
  var boardEl = document.getElementById('board'), metaEl = document.getElementById('meta'),
      tabsEl = document.getElementById('tabs'), regionEl = document.getElementById('region'), noteEl = document.getElementById('note');
  // ?region=us|uk|row shows that board on its own, for embedding one board per page.
  var only = (location.search.match(/[?&]region=([a-z_]+)/i) || [])[1];
  var data = null, current = null;
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="#1b3b15" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="width:30px;height:30px"><rect x="4" y="11" width="16" height="10" rx="1" fill="#1b3b15"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function reportHeight() {
    if (window.parent !== window) window.parent.postMessage({ thLeaderboardHeight: document.documentElement.scrollHeight }, '*');
  }

  function renderTabs(regions) {
    if (only || regions.length < 2) { tabsEl.style.display = 'none'; return; }
    tabsEl.innerHTML = '';
    regions.forEach(function (reg) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = (reg.label || '').toUpperCase();
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', reg.key === current ? 'true' : 'false');
      b.onclick = function () { current = reg.key; renderTabs(regions); renderBoard(); };
      tabsEl.appendChild(b);
    });
  }

  function renderBoard() {
    var regions = (data && data.regions) || [];
    var reg = regions.filter(function (r) { return r.key === current; })[0] || regions[0] || {};
    var top = reg.top || [];

    regionEl.textContent = reg.title || reg.label || '';
    noteEl.textContent = reg.note || '';
    noteEl.style.display = reg.note ? '' : 'none';

    if (!top.length) {
      boardEl.innerHTML = '<li class="empty">' + LOCK + '<strong>' + esc(data.emptyHeading || 'No pirates on this board yet') + '</strong>' +
        (data.emptyMessage ? '<p>' + esc(data.emptyMessage) + '</p>' : '') + '</li>';
    } else {
      var marksTop3 = reg.treasure !== false;
      boardEl.innerHTML = top.map(function (p) {
        return '<li class="row' + (marksTop3 && p.rank <= 3 ? ' top3' : '') + '">' +
          '<span class="rank">' + p.rank + '</span>' +
          '<span class="name">' + esc(p.name || p.handle) + '</span>' +
          '<span class="handle">' + esc(p.handle || '—') +
            (p.platform ? ' <em>(' + esc(p.platform) + ')</em>' : '') + '</span>' +
          '<span class="country">' + esc(p.country || '—') + '</span>' +
          '<span class="pts">' + Number(p.points).toLocaleString() + '<small>PTS</small></span></li>';
      }).join('');
    }

    if (data && data.updated) {
      var t = new Date(data.updated);
      metaEl.textContent = 'Updated ' + t.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    reportHeight();
  }

  function load() {
    fetch('leaderboard.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        data = d;
        var regions = d.regions || [];
        if (only) regions = regions.filter(function (r) { return r.key === only; });
        data.regions = regions;
        if (!current || !regions.some(function (r) { return r.key === current; })) current = (regions[0] || {}).key;
        renderTabs(regions);
        renderBoard();
      })
      .catch(function () {
        if (!boardEl.querySelector('.row')) boardEl.innerHTML = '<li class="empty"><p>The leaderboard is taking a breather. Check back soon!</p></li>';
        reportHeight();
      });
  }

  load();
  setInterval(load, 5 * 60 * 1000);
  window.addEventListener('resize', reportHeight);
  if (document.fonts) document.fonts.ready.then(reportHeight);
})();
</script>
</body>
</html>
